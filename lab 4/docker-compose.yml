name: ddss-lab4-cassandra

services:
  cassandra-1:
    image: cassandra:5.0
    container_name: cassandra-1
    hostname: cassandra-1
    environment:
      CASSANDRA_CLUSTER_NAME: ddss-lab4-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    ports:
      - "9042:9042"
    volumes:
      - cassandra1_data:/var/lib/cassandra
      - ./scripts:/lab/scripts:ro
    networks:
      - cassandra-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20

  cassandra-2:
    image: cassandra:5.0
    container_name: cassandra-2
    hostname: cassandra-2
    environment:
      CASSANDRA_CLUSTER_NAME: ddss-lab4-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    depends_on:
      - cassandra-1
    volumes:
      - cassandra2_data:/var/lib/cassandra
      - ./scripts:/lab/scripts:ro
    networks:
      - cassandra-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20

  cassandra-3:
    image: cassandra:5.0
    container_name: cassandra-3
    hostname: cassandra-3
    environment:
      CASSANDRA_CLUSTER_NAME: ddss-lab4-cluster
      CASSANDRA_SEEDS: cassandra-1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 256M
    depends_on:
      - cassandra-1
    volumes:
      - cassandra3_data:/var/lib/cassandra
      - ./scripts:/lab/scripts:ro
    networks:
      - cassandra-net
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 20

networks:
  cassandra-net:

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:
